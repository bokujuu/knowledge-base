name: Weekly knowledge-base review

on:
  schedule:
    # Sunday 09:00 JST (00:00 UTC)
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  weekly-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan open items
        id: scan
        run: |
          python3 scripts/python/weekly_review_scan.py \
            --date "$(date -u +%Y-%m-%d)" \
            --output /tmp/weekly-review.md
          if grep -q "未決・要確認の項目は見つかりませんでした" /tmp/weekly-review.md; then
            echo "has_items=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_items=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure labels
        if: steps.scan.outputs.has_items == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description,
                  });
                } else {
                  throw error;
                }
              }
            }
            await ensureLabel('weekly-review', '1d76db', 'Weekly automation review');
            await ensureLabel('review', 'fbca04', 'Needs review or discussion');

      - name: Create weekly review issue
        if: steps.scan.outputs.has_items == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/weekly-review.md', 'utf8');
            const date = new Date().toISOString().slice(0, 10);
            const title = `Weekly review: 未決事項 (${date})`;

            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['weekly-review', 'review'],
            });
            core.info(`Created issue #${created.number}`);
