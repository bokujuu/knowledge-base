<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motion Canvas Embed</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #05070b;
        overflow: hidden;
      }
      motion-canvas-player {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <motion-canvas-player></motion-canvas-player>
    <script type="module">
      import '@motion-canvas/player';

      const manifest = await fetch('/embed/manifest.json').then((res) => res.json());
      const player = document.querySelector('motion-canvas-player');
      player.setAttribute('src', manifest.motionCanvas);
      player.togglePlayback(true);
    </script>
  </body>
</html>
