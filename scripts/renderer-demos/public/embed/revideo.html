<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revideo Embed</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #05070b;
        overflow: hidden;
      }
      revideo-player {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <revideo-player></revideo-player>
    <script type="module">
      import '@revideo/player';

      const manifest = await fetch('/embed/manifest.json').then((res) => res.json());
      const player = document.querySelector('revideo-player');
      player.setAttribute('src', manifest.revideo);
      player.togglePlayback(true);
    </script>
  </body>
</html>
